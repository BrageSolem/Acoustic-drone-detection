<!DOCTYPE html>
<html lang="en">
<head>
    <title>Drone Detection Network</title>
    <script src="/socket.io/socket.io.js"></script>

    <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link
            rel="stylesheet"
            href="styles.css"
    />
</head>
<body>

<div class="sidebar">
    <svg viewBox="0 0 300 300">
        <circle
                id="mainCircle"
                cx="150"
                cy="150"
                r="100"
                fill="none"
                stroke="black"
                stroke-width="3"
        />

        <line
                id="radiusLine"
                x1="150"
                y1="150"
                x2="250"
                y2="150"
                stroke="red"
                stroke-width="3"
        />

        <circle
                id="centerDot"
                cx="150"
                cy="150"
                r="5"
                fill="black"
        />

        <circle
                id="movingDot"
                cx="250"
                cy="150"
                r="6"
                fill="blue"
        />
    </svg>
    <label>
        <select id ="debugDropdown">
            <option value="up">Up</option>
            <option value="right">Right</option>
            <option value="down">Down</option>
            <option value="left">Left</option>
        </select>
    </label>
</div>

<div class="center">
    <div id="map"></div>
    <div class="video-container">
        <video class="video" id ="droneVideo" autoplay></video>
    </div>
    <button onclick="addDrone()">Simulate Drone Detection</button>
</div>

<div class="sidebar">
    <h3>Identified Drones</h3>
    <div id="droneList", class="sidebar-list"></div>
</div>

<script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script defer src="scripts.js"></script>
</body>
</html>
